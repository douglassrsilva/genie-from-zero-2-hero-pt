command:
  - streamlit
  - run
  - app.py
  - --server.address=0.0.0.0
  - --server.port=8000
  - --server.headless=true

# Associe no Databricks Apps um recurso SQL Warehouse com a chave abaixo.
# UTILITY_CATALOG e UTILITY_SCHEMA devem ser adicionados no deploy; nenhum nome
# de ambiente é versionado neste repositório.
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

